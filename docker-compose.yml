  #     context: ./app/analytics
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8000:8000"
  #   networks:
  #     - corbicula_network

networks:
  corbicula_network:
    driver: bridge

volumes:
  postgres_data:
  backend_modules:
